name: Deploy Django app

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code from GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Copy files to your server with appleboy
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        script: |
          set -e
          cd /home/admissions/NDU_Admission_backend
          git reset --hard
          # Drop server-generated merge migration files so they don't conflict with git.
          git clean -fd Programs/migrations/ || true

          git pull origin main
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # Fake known duplicate-column migrations (already present in DB).
          # python manage.py migrate Programs 0019_course_material --fake
          # python manage.py migrate admissions 0053_admittedstudent_registration_tuition_pct_cache --fake
          # python manage.py migrate Programs 0023_teaching_section --fake
          # python manage.py migrate Programs 0024_timetablesession_teaching_section --fake
          # python manage.py migrate Programs 0025_courseunitsectionlecturer --fake

          python manage.py migrate admissions 0054_exemption_score_and_documents --fake
          python manage.py migrate admissions 0057_exemption_pricing_basis --fake
          python manage.py migrate admissions 0058_exemption_line_decision --fake

          # Real migrate: adds registration_kind (fixes registration_lookup 500s).
          # On prod the column may already exist — fake 0021 if so, then continue.
          python manage.py migrate Programs 0020_alter_lectureattendancerecord_marked_via || true
          python manage.py migrate Programs 0021_retake_missed_paper_registration --fake
          python manage.py migrate Programs 0026_merge_retake_and_teaching_sections || true
          python manage.py migrate

          python manage.py ensure_program_choice_confirmation_columns || true
          python manage.py ensure_portal_branding_columns || true
          python manage.py ensure_teaching_section_columns || true
          python manage.py refresh_tuition_pct_cache || true

          python manage.py collectstatic --noinput

          sudo systemctl restart gunicorn
          sudo systemctl restart celery || true
          sudo systemctl restart celery-beat || true
          sudo systemctl restart nginx
          git log -1 --oneline
          sudo systemctl is-active gunicorn
